name: Engine tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install verified tooling
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash ci/build-renderers.sh --install "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python -m pip install --require-hashes -r ci/dev.lock
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=manifest_diff --cov-report=term-missing
      - name: Exercise isolated production entry point
        run: |
          mkdir "$RUNNER_TEMP/snapshot"
          cp -r examples .manifest-diff.yaml "$RUNNER_TEMP/snapshot/"
          python -m manifest_diff.cli "$RUNNER_TEMP/snapshot" "$RUNNER_TEMP/snapshot" | grep -F 'No semantic changes'
      - name: Validate workflows
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          actionlint
