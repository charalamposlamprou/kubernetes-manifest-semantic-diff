name: Kubernetes manifest review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: charalamposlamprou/kubernetes-manifest-semantic-diff/.github/workflows/kustomize-diff.yaml@fd585c9f4a55550eb48fe050d29c48568db1f12b
