apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - service-headless.yaml
images:
  - name: ghcr.io/example/backend
    newTag: "1.1.0"
patches:
  - path: capacity.yaml
  - target: {kind: Ingress, name: backend}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: backend.production.example.test}
