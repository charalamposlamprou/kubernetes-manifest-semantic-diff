apiVersion: v1
kind: ServiceAccount
metadata: {name: backend}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: backend-settings-reader}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: backend-read}
subjects:
  - {kind: ServiceAccount, name: backend}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backend-settings-reader}
