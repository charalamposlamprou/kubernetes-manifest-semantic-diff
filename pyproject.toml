[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-manifest-semantic-diff"
version = "1.0.0"
description = "Field-level pull request reviews for rendered Helm and Kustomize resources"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]
readme = "README.md"

[project.scripts]
manifest-diff = "manifest_diff.cli:main"

[tool.setuptools]
packages = ["manifest_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4","E7","E9","F","I","B","UP"]
